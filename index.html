<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Next Station London Helper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="loading">
  <div class="bg"></div>

  <div class="stage">
    <header>
      <h1>Next Station <span>London</span></h1>
      <div class="badges">
        <span id="round" class="badge">Round 1 / 4</span>
        <span id="count" class="badge">Turn 0</span>
      </div>
    </header>

    <main>
      <div class="deal">
        <div class="row">
          <div id="pile" class="pile" aria-label="Cards already drawn"></div>
          <div class="stack">
            <div id="held" class="card held" hidden></div>
            <div id="card" class="card" role="button" tabindex="0" aria-live="polite"></div>
          </div>
        </div>
        <div id="last-tag" class="last-tag off"></div>
      </div>
    </main>

    <section class="line" aria-label="Underground cards drawn this round">
      <div id="stops" class="stops"></div>
      <div class="line-label">Underground cards</div>
    </section>
  </div>

  <div id="splash" class="splash" hidden><div id="splash-text"></div></div>

  <div id="past" class="overlay" hidden>
    <div class="overlay-box">
      <h2>Drawn this round</h2>
      <div id="past-grid" class="past-grid"></div>
      <p class="hint">Press any key to close</p>
    </div>
  </div>

  <div class="footer-hint"><strong>Enter</strong> draw · <strong>Backspace</strong> undo · <strong>P</strong> past cards · <strong>F</strong> full screen · <strong>N</strong> new game</div>
  <div class="disclaimer">Unofficial fan-made tool. Next Station London™ is a trademark of Blue Orange Edition.</div>

  <script src="script.js"></script>
</body>
</html>
